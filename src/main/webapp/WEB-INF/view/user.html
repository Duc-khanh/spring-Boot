<!DOCTYPE html >
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="en">
<head th:replace="layout :: head"  >
    <title>User Dashboard</title>
</head>
<body>

<header th:replace="layout :: header"></header>

<main class="container">
    <a href="/blog" class="back-link">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        Back to Blog
    </a>

    <div class="card" style="max-width: 600px; margin: 0 auto; padding: 40px; text-align: center;">
        <div style="font-size: 50px; margin-bottom: 20px;">👤</div>
        <h1 style="font-family: 'Outfit', sans-serif; font-size: 28px; font-weight: 700; margin-top: 0; margin-bottom: 10px;">
            User Space
        </h1>
        <p style="color: var(--text-secondary); margin-bottom: 30px;">
            Welcome to your personal dashboard. Here are your account details.
        </p>

        <div style="background: rgba(15, 23, 42, 0.4); border: 1px solid var(--card-border); border-radius: 8px; padding: 20px; text-align: left; margin-bottom: 30px;">
            <div style="display: flex; justify-content: space-between; margin-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 8px;">
                <span style="color: var(--text-secondary);">Username:</span>
                <strong sec:authentication="name">user</strong>
            </div>
            <div style="display: flex; justify-content: space-between; margin-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 8px;">
                <span style="color: var(--text-secondary);">Role:</span>
                <span class="badge badge-role">ROLE_USER</span>
            </div>
            <div style="display: flex; justify-content: space-between;">
                <span style="color: var(--text-secondary);">Status:</span>
                <span style="color: var(--success-color); font-weight: 600;">Active</span>
            </div>
        </div>

        <a href="/blog/create" class="btn btn-primary" style="width: 100%; box-sizing: border-box;">Create a New Article</a>
    </div>
</main>

<footer th:replace="layout :: footer"></footer>

</body>
</html>
