<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="en">
<head th:replace="layout :: head">
    <title>Edit Post</title>
</head>
<body>

<header th:replace="layout :: header"></header>

<main class="container">
    <a th:href="@{/blog/view/{id}(id=${blog.id})}" class="back-link">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        Cancel and return
    </a>

    <div class="card" style="max-width: 700px; margin: 0 auto; padding: 40px;">
        <h1 style="font-family: 'Outfit', sans-serif; font-size: 28px; font-weight: 700; margin-top: 0; margin-bottom: 30px;">
            Edit Article
        </h1>

        <form th:action="@{/blog/update}" th:object="${blog}" method="post">
            <!-- Keep the ID and Date Created hidden -->
            <input type="hidden" th:field="*{id}" />
            <input type="hidden" th:field="*{dateCreated}" />

            <div class="form-group">
                <label class="form-label" for="title">Title</label>
                <input class="form-control" type="text" id="title" th:field="*{title}" required />
            </div>

            <div class="form-group">
                <label class="form-label" for="author">Author</label>
                <input class="form-control" type="text" id="author" th:field="*{author}" required />
            </div>

            <div class="form-group">
                <label class="form-label" for="content">Content</label>
                <textarea class="form-control" id="content" th:field="*{content}" required></textarea>
            </div>

            <div class="form-actions">
                <a th:href="@{/blog/view/{id}(id=${blog.id})}" class="btn btn-secondary">Cancel</a>
                <button type="submit" class="btn btn-primary">Update Article</button>
            </div>
        </form>
    </div>
</main>

<footer th:replace="layout :: footer"></footer>

</body>
</html>
