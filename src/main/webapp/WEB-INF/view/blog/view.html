<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="en">
<head th:replace="layout :: head">
    <title>Blog Detail</title>
</head>
<body>

<header th:replace="layout :: header"></header>

<main class="container">
    <a href="/blog" class="back-link">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        Back to articles
    </a>

    <article class="card" style="padding: 40px;">
        <div class="blog-meta" style="margin-bottom: 20px;">
            <span>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                Published by <strong style="color: var(--text-primary);" th:text="${blog.author}">Author</strong>
            </span>
            <span>•</span>
            <span>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                <th:block th:text="${blog.dateCreated}"></th:block>
            </span>
        </div>

        <h1 style="font-family: 'Outfit', sans-serif; font-size: 36px; font-weight: 700; margin-top: 0; margin-bottom: 30px; line-height: 1.2;" 
            th:text="${blog.title}">
            Blog Title
        </h1>

        <div style="font-size: 16px; line-height: 1.8; color: #d1d5db; white-space: pre-wrap;" th:text="${blog.content}">
            Blog content goes here...
        </div>

        <div sec:authorize="isAuthenticated()" class="blog-actions" style="margin-top: 40px;">
            <div></div>
            <div class="action-group">
                <a th:href="@{/blog/edit/{id}(id=${blog.id})}" class="btn btn-secondary">Edit Post</a>
                <a th:href="@{/blog/delete/{id}(id=${blog.id})}" class="btn btn-danger"
                   onclick="return confirm('Are you sure you want to delete this blog post?');">Delete</a>
            </div>
        </div>
    </article>
</main>

<footer th:replace="layout :: footer"></footer>

</body>
</html>
